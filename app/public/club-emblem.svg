<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <path id="topArc" d="M 256,96 A 160,160 0 0 1 416,256" fill="none"/>
    <path id="topArcL" d="M 96,256 A 160,160 0 0 1 256,96" fill="none"/>
    <clipPath id="innerClip"><circle cx="256" cy="256" r="118"/></clipPath>
  </defs>

  <!-- Outer navy ring -->
  <circle cx="256" cy="256" r="252" fill="#0A0F1E"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#C9A227" stroke-width="4"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#C9A227" stroke-width="2.5"/>

  <!-- Gold curved text along top half -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#C9A227" letter-spacing="6">
    <textPath href="#topArcL" startOffset="4%">BMW</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#C9A227" letter-spacing="6">
    <textPath href="#topArc" startOffset="2%">CAR CLUB EUROPE</textPath>
  </text>

  <!-- Gold laurel branches along inner ring, bottom half -->
  <g fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round">
    <!-- left branch -->
    <path d="M 118,332 A 156,156 0 0 0 236,410" />
    <g stroke-width="3">
      <path d="M 128,316 l -20,-6"/><path d="M 142,344 l -22,0"/><path d="M 162,368 l -20,8"/>
      <path d="M 188,388 l -18,12"/><path d="M 216,402 l -14,16"/>
      <path d="M 126,300 l -16,-14"/><path d="M 146,328 l -20,-8"/><path d="M 170,354 l -18,2"/>
      <path d="M 198,376 l -16,6"/><path d="M 226,392 l -12,12"/>
    </g>
    <!-- right branch -->
    <path d="M 394,332 A 156,156 0 0 1 276,410" />
    <g stroke-width="3">
      <path d="M 384,316 l 20,-6"/><path d="M 370,344 l 22,0"/><path d="M 350,368 l 20,8"/>
      <path d="M 324,388 l 18,12"/><path d="M 296,402 l 14,16"/>
      <path d="M 386,300 l 16,-14"/><path d="M 366,328 l 20,-8"/><path d="M 342,354 l 18,2"/>
      <path d="M 314,376 l 16,6"/><path d="M 286,392 l 12,12"/>
    </g>
  </g>

  <!-- Two small gold stars flanking the bottom -->
  <path fill="#C9A227" d="M 130,262 l 4.9,10 11,1.6 -8,7.8 1.9,11 -9.8,-5.2 -9.8,5.2 1.9,-11 -8,-7.8 11,-1.6 z"/>
  <path fill="#C9A227" d="M 382,262 l 4.9,10 11,1.6 -8,7.8 1.9,11 -9.8,-5.2 -9.8,5.2 1.9,-11 -8,-7.8 11,-1.6 z"/>

  <!-- Quartered center: alternating sky blue and white -->
  <g clip-path="url(#innerClip)">
    <rect x="138" y="138" width="236" height="236" fill="#FFFFFF"/>
    <path d="M 256,256 L 256,138 A 118,118 0 0 1 374,256 Z" fill="#8FC1E8"/>
    <path d="M 256,256 L 256,374 A 118,118 0 0 1 138,256 Z" fill="#8FC1E8"/>
  </g>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#0A0F1E" stroke-width="6"/>
</svg>
